name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Cache Bun packages
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install
        run: bun install --frozen-lockfile

      # Two data worlds: nothing real ever enters the repository.
      - name: No real data in the repo
        run: bun run check:data

      # Known vulnerabilities in any installed package: fail on high or critical. npm's advisory service first,
      # retried; if it's down, OSV (osv.dev) for the same packages. Fails, saying why, if neither can be reached.
      - name: Dependency audit
        run: bun run audit

      - name: Typecheck (server, schema, ui, portal, admin)
        run: bun run typecheck

      # Includes contract.test.ts, which fails if a frontend's API contract copy is stale.
      - name: Test
        run: bun test

      - name: Build portal, admin and site
        run: bun run build

      # The design system: every story renders in Chromium, its play function runs, and axe checks it
      # (report-only until principles.md's open contrast questions are settled).
      - name: Install Chromium for Storybook tests
        run: bunx playwright install --with-deps chromium-headless-shell

      - name: Storybook interaction tests
        run: bun run test:storybook

      - name: Build Storybook
        run: bun run storybook:build
